[workspace]
resolver = "2"
members = [
    "crates/yomnova-diagnostics",
    "crates/yomnova-ast",
    "crates/yomnova-lexer",
    "crates/yomnova-parser",
    "crates/yomnova-types",
    "crates/yomnova-sema",
    "crates/yomnova-ownership",
    "crates/yomnova-ir",
    "crates/yomnova-bytecode",
    "crates/yomnova-vm",
    "crates/yomnova-network-core",
    "crates/yomnova-stdlib",
    "crates/yomnova-compiler",
    "crates/yomnova-cli",
]

[workspace.package]
version = "0.1.0"
authors = ["Mouhamed Salim Bousmina"]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/slimecoding2025/yomnova"

[workspace.dependencies]
thiserror = "2.0"
