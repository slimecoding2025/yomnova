[package]
name = "yomnova-parser"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
yomnova-diagnostics = { path = "../yomnova-diagnostics" }
yomnova-ast = { path = "../yomnova-ast" }
yomnova-lexer = { path = "../yomnova-lexer" }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde", "yomnova-diagnostics/serde", "yomnova-ast/serde", "yomnova-lexer/serde"]
